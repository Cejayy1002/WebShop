<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="signupstyle.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="signup-container">
        <h1>Create Account</h1>

        <form id="signupForm">

            <div class="form-group">
                <label for="newEmail">Email:</label>
                <input 
                    type="email" 
                    id="newEmail" 
                    name="newEmail" 
                    placeholder="Enter your email" 
                    required>
            </div>

            <div class="form-group">
                <label for="newPassword">Password:</label>
                <div class="password-input">
                <input 
                    type="password" 
                    id="newPassword" 
                    name="newPassword" 
                    placeholder="Enter your password" 
                    required>
                    <button class="password-toggle" type="button" data-target="newPassword" aria-label="Show password"><i class="bx bx-show"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <div class="password-input">
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Confirm your password" 
                    required>
                    <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Show password"><i class="bx bx-show"></i></button>
                </div>
            </div>

            <p id="message"></p>
            <p id="errorMessage"></p>

            <button type="submit">Sign Up</button>
            <p>Already have an account? <a href="login.html">Login</a></p>

        </form>
    </div>
    <script src="signup.js"></script>
</body>
</html>
