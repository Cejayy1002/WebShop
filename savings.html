<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#12171e">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="homestyle.css">
</head>
<body>
    <aside id="sidebar"></aside>
    <main class="main-content dashboard-content settings-content">
        <div class="dashboard-header">
            <div><p class="eyebrow">DEVELOPMENT</p><h1>GitHub</h1><p class="welcome-text">Save and organize your GitHub repositories.</p></div>
            <button class="action-button" id="showRepositoryForm" type="button"><i class="bx bx-plus"></i> Add repository</button>
        </div>
        <section class="panel form-panel" id="repositoryFormPanel" hidden>
            <div class="panel-heading"><div><h2>Link a repository</h2><p>Save GitHub repository links in this browser.</p></div></div>
            <form id="repositoryForm" class="inline-form">
                <input id="repositoryName" required placeholder="Repository name" aria-label="Repository name">
                <input id="repositoryUrl" required type="url" placeholder="https://github.com/user/repository" aria-label="GitHub repository URL">
                <button class="action-button" type="submit">Save repository</button>
            </form>
            <p id="repositoryMessage" role="status"></p>
        </section>
        <section class="panel">
            <div class="panel-heading"><div><h2>Saved repositories</h2><p id="repositoryCount">0 repositories</p></div><i class="bx bxl-github panel-icon"></i></div>
            <div id="repositoryList" class="data-list"><p class="empty-state">No repositories saved yet.</p></div>
        </section>
    </main>
    <script src="sidebar.js"></script>
    <script src="logout.js"></script>
    <script src="savings.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
