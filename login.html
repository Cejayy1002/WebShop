<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body class="auth-page login-page">

    <div class="login-container">
        <div class="auth-brand" aria-label="Personal Vault">
            <span class="auth-brand-icon"><i class="bx bx-lock-alt"></i></span>
            <span>Personal Vault</span>
        </div>
        <h1>Login</h1>
        <p class="auth-subtitle">Sign in securely to access your personal vault.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Email:</label>
                <input 
                    type="email" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your email" 
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <div class="password-input">
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    autocomplete="current-password"
                    required>
                    <button class="password-toggle" type="button" data-target="password" aria-label="Show password"><i class="bx bx-show"></i></button>
                </div>
            </div>

            <div class="auth-status" aria-live="polite">
                <p id="message"></p>
                <p id="errorMessage"></p>
            </div>

            <button class="auth-submit" type="submit"><span>Login</span><i class="bx bx-arrow-to-right"></i></button>
            <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>

        </form>
    </div>

    <script src="login.js"></script>

</body>
</html>
